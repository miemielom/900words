<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WordFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#4263eb">
<title>WordFlow · 闪卡背词</title>
<style>
:root{--ink:#17243a;--muted:#718096;--line:#e8edf4;--blue:#4263eb;--paper:#f5f7fb;--card:#fff;--hover:#f4f6ff}
@media (prefers-color-scheme:dark){:root{--ink:#e8edf7;--muted:#8a96aa;--line:#2a3347;--blue:#7c91ff;--paper:#0f1420;--card:#18202f;--hover:#1f2940}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--paper);color:var(--ink);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:14px 18px;gap:12px;max-width:1600px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:26px;font-weight:800;letter-spacing:-.8px}.brand span{color:var(--blue)}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font-size:15px;font-weight:650;padding:9px 18px;border-radius:9px;min-height:40px;font-family:inherit}
.tabs button.on{background:var(--blue);color:#fff}
.tools button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;min-height:40px;padding:0 12px;font-size:14px;font-family:inherit}
main{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 2.3fr 1.05fr;gap:16px}
.panel{display:flex;flex-direction:column;min-height:0}
.ptitle{font-size:15px;font-weight:700;margin-bottom:8px}
.list{position:relative;flex:1;overscroll-behavior:contain;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:14px}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:15px;padding:11px 12px;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row i{font-style:normal;color:var(--muted);margin-right:12px;font-variant-numeric:tabular-nums}
.row.cur{background:var(--hover);color:var(--blue);font-weight:700}
.row.mk{border-left:3px solid #f59f00}
.study{justify-content:center}
.pt{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.track{height:6px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 14px}
.fill{height:6px;background:linear-gradient(90deg,#4263eb,#7c91ff);border-radius:8px}
#card{width:100%;min-height:240px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 35px rgba(35,55,100,.08);
  font-size:clamp(40px,6vw,76px);font-weight:800;letter-spacing:-1.5px;color:var(--ink);line-height:1.15;word-break:break-word;padding:20px;font-family:inherit;touch-action:manipulation}
#card:active{border-color:var(--blue)}
.acts button:active{filter:brightness(.92)}
#ans{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;font-size:clamp(20px,2.6vw,28px);font-weight:600;padding:16px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.acts button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;font-weight:650;font-family:inherit}
.acts .pri{background:var(--blue);border-color:var(--blue);color:#fff}
.acts .warn{color:#e03131}
.empty[hidden],#live[hidden]{display:none}
.empty{color:var(--muted);text-align:center;padding:60px 10px;font-size:18px}
dialog{border:0;border-radius:16px;padding:20px;background:var(--card);color:var(--ink);max-width:420px;width:90%}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 8px}dialog p{color:var(--muted);font-size:14px;line-height:1.5}
dialog .b{display:flex;flex-direction:column;gap:8px;margin-top:12px}
dialog button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px;font-family:inherit}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#17243a;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr;}
  main>.panel:nth-child(2){order:-1}
  .list{max-height:30vh}
  #card{min-height:160px}#ans{min-height:80px}
  body{overflow:auto}#app{height:auto;min-height:100%}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Word<span>Flow</span></div>
    <div class="tabs" id="tabs">
      <button data-m="list">单词列表</button><button data-m="vocab">背生词</button><button data-m="reset">重置</button>
    </div>
    <div class="tools"><button id="bk">备份 / 恢复</button></div>
  </header>
  <main>
    <section class="panel"><div class="ptitle">单词列表</div><div class="list" id="lw"></div></section>
    <section class="panel study">
      <div class="ptitle">学习区</div>
      <div id="stage">
        <div id="empty" class="empty" hidden></div>
        <div id="live">
          <div class="pt"><span>进度</span><span id="pn"></span></div>
          <div class="track"><div class="fill" id="pf"></div></div>
          <button id="card"></button>
          <div id="ans"></div>
        </div>
        <div class="acts"><button id="bp">← 上一个</button><button id="bm">标记为生词</button><button id="bn" class="pri">下一个 →</button></div>
      </div>
    </section>
    <section class="panel"><div class="ptitle" id="vt">生词库</div><div class="list" id="lv"></div></section>
  </main>
</div>

<dialog id="dlg">
  <h3>备份 / 恢复</h3>
  <p>进度和生词保存在本机浏览器里。换设备、清除网站数据前，请先导出备份。</p>
  <div class="b">
    <button id="ex">导出备份（保存到“文件”）</button>
    <button id="im">导入备份…</button>
    <button id="cl">关闭</button>
  </div>
  <input type="file" id="fi" accept=".json,application/json" hidden>
</dialog>
<div id="toast"></div>

function save(){ dirty=true; clearTimeout(st); st=setTimeout(flush,300); }
addEventListener('pagehide',flush); document.addEventListener('visibilitychange',()=>{ if(document.hidden) flush(); });

function toast(t){ const e=$('#toast'); e.textContent=t; e.style.opacity=1; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.opacity=0,2200); }

let mode='list', index=Math.min(store.next_index||0, words.length), revealed=false;
const inVocab = () => mode==='vocab';
let vset = new Set(store.vocab.map(x=>lc(x.word)));
const has = w => vset.has(lc(w));

// ---------- 一次性构建 900 行，之后只改 class ----------
const lw=$('#lw'), lv=$('#lv');
lw.innerHTML = words.map(([w],i)=>`<button class="row${has(w)?' mk':''}" data-i="${i}"><i>${String(i+1).padStart(3,'0')}</i>${esc(w)}</button>`).join('');
const lwRows = lw.children;
const wordPos = new Map(words.map(([w],i)=>[lc(w),i]));
let lwCur=null, lvCur=null;

function buildVocabList(){
  vset = new Set(store.vocab.map(x=>lc(x.word)));
  lv.innerHTML = store.vocab.length ? store.vocab.map((x,j)=>`<button class="row" data-j="${j}">${esc(x.word)}</button>`).join('') : '<div class="empty">—</div>';
  $('#vt').textContent='生词库 · '+store.vocab.length;
  lvCur=null;
}
function ensureVisible(box, el, center){
  const t=el.offsetTop, h=el.offsetHeight, s=box.scrollTop, H=box.clientHeight;
  if(center || t<s || t+h>s+H) box.scrollTop = t - H/3;
}

const E={card:$('#card'),ans:$('#ans'),pn:$('#pn'),pf:$('#pf'),bm:$('#bm'),live:$('#live'),empty:$('#empty')};
let lastWord=null;

function paintStage(){
  const arr = inVocab()? store.vocab : words;
  const total = arr.length;
  const c = arr[index];
  if(!c){
    E.live.hidden=true; E.empty.hidden=false;
    E.empty.textContent = inVocab()?'生词库是空的，先去标记几个生词吧':'已全部完成 🎉';
    E.bm.style.visibility='hidden'; return;
  }
  const word = inVocab()? c.word : c[0], meaning = inVocab()? c.meaning : c[1];
  E.live.hidden=false; E.empty.hidden=true; E.bm.style.visibility='';
  E.card.textContent = word;
  E.ans.textContent = revealed ? (meaning||'（暂无释义）') : '';
  E.pn.textContent = (index+1)+' / '+total;
  E.pf.style.width = Math.round((index+1)/total*100)+'%';
  const rm = inVocab()||has(word);
  E.bm.textContent = rm?'移除生词':'标记为生词';
  E.bm.classList.toggle('warn',rm);
}
function paintCursor(center){
  if(lwCur){ lwCur.classList.remove('cur'); lwCur=null; }
  if(lvCur){ lvCur.classList.remove('cur'); lvCur=null; }
  if(inVocab()){ lvCur = lv.children[index]&&lv.children[index].dataset.j!==undefined ? lv.children[index] : null; if(lvCur){ lvCur.classList.add('cur'); ensureVisible(lv,lvCur,center); } }
  else { lwCur = lwRows[index]||null; if(lwCur){ lwCur.classList.add('cur'); ensureVisible(lw,lwCur,center); } }
}
function render(center){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.m===mode));
  paintStage(); paintCursor(center);
}
buildVocabList();

function setMode(m){
  revealed=false;
  if(m==='reset'){
    if(!confirm('确定把原题库进度重置到第 1 个吗？（生词库不会被清空）')) return;
    store.next_index=0; save(); mode='list'; index=0; render(true); toast('已重置'); return;
  }
  mode=m; index = m==='vocab' ? 0 : Math.min(store.next_index, words.length);
  render(true);
}
function next(){ revealed=false;
  if(inVocab()){ const n=store.vocab.length; index=n?(index+1)%n:0; }
  else { index=Math.min(index+1,words.length); store.next_index=index; save(); }
  render(); }
function prev(){ revealed=false;
  if(inVocab()){ const n=store.vocab.length; index=n?(index-1+n)%n:0; }
  else { index=Math.max(index-1,0); store.next_index=index; save(); }
  render(); }
function flip(){ revealed=!revealed; paintStage(); }
function mark(){
  if(inVocab()){
    if(index<store.vocab.length){
      const w=store.vocab[index].word; store.vocab.splice(index,1);
      index=Math.min(index,Math.max(store.vocab.length-1,0)); revealed=false;
      const p=wordPos.get(lc(w)); buildVocabList(); if(p!==undefined) lwRows[p].classList.remove('mk');
    }
  } else {
    const [w,m]=words[index]||[]; if(!w) return;
    if(has(w)){ store.vocab=store.vocab.filter(x=>lc(x.word)!==lc(w)); lwRows[index].classList.remove('mk'); }
    else { store.vocab.push({word:w,meaning:m}); lwRows[index].classList.add('mk'); }
    buildVocabList();
  }
  save(); render();
}

// ---------- 按下即触发（pointerdown），不等手指抬起 ----------
function fast(el,fn){ el.addEventListener('pointerdown',e=>{ e.preventDefault(); fn(); }); }
fast($('#bp'),prev); fast($('#bn'),next); fast($('#bm'),mark);
// 卡片：抬起时触发，但滑动不算点击
let cx=0,cy=0; 
E.card.addEventListener('pointerdown',e=>{cx=e.clientX;cy=e.clientY;});
E.card.addEventListener('pointerup',e=>{ if(Math.abs(e.clientX-cx)<12&&Math.abs(e.clientY-cy)<12) flip(); });

lw.addEventListener('click',e=>{const b=e.target.closest('[data-i]'); if(!b) return;
  mode='list'; index=+b.dataset.i; store.next_index=index; save(); revealed=false; render(); });
lv.addEventListener('click',e=>{const b=e.target.closest('[data-j]'); if(!b) return;
  mode='vocab'; index=+b.dataset.j; revealed=false; render(); });
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) setMode(b.dataset.m);});

// 外接键盘：空格=下一个 S=上一个 F=翻面 D=标记
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)next();}
  else if(e.repeat) return;
  else if(e.code==='KeyS')prev(); else if(e.code==='KeyF')flip(); else if(e.code==='KeyD')mark();
});
// 学习区左右滑动
let sx=null;
const sp=$('.study');
sp.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
sp.addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>70){ dx<0?next():prev(); }},{passive:true});
// 禁止双击缩放
let lt=0; document.addEventListener('touchend',e=>{ const n=Date.now(); if(n-lt<300 && !e.target.closest('.list')) e.preventDefault(); lt=n; },{passive:false});

// 备份
const dlg=$('#dlg');
$('#bk').onclick=()=>{flush();dlg.showModal();}; $('#cl').onclick=()=>dlg.close();
$('#ex').onclick=()=>{
  flush();
  const blob=new Blob([JSON.stringify(store,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='wordflow备份.json'; a.click();
};
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{
  try{ const o=JSON.parse(await e.target.files[0].text());
    if(!Array.isArray(o.vocab)) throw 0;
    store={vocab:o.vocab, next_index:Math.max(0,+o.next_index||0)}; save(); flush();
    for(const r of lwRows) r.classList.remove('mk');
    buildVocabList(); store.vocab.forEach(x=>{const p=wordPos.get(lc(x.word)); if(p!==undefined) lwRows[p].classList.add('mk');});
    mode='list'; index=Math.min(store.next_index,words.length); revealed=false; dlg.close(); render(true); toast('已恢复');
  }catch(_){ toast('备份文件无效'); }
  e.target.value='';
};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
render(true);
if(!storeOK) toast('当前环境无法保存进度，请改用“文档”类浏览器或定期导出备份');
</script>
</body>
</html>
